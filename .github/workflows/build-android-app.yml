# Builds the Token Printer Android app and puts the APK at a permanent download link:
#   https://github.com/SOCTeddy/Token-Printer/releases/download/app/TokenPrinter.apk
# Runs when anything in the android/ folder changes, or by hand from the Actions tab ("Run workflow").
# Changes to index.html don't need a new APK: the app loads the live site.
name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # comes with the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load the signing key from the repo's secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (repo Settings > Secrets and variables > Actions), then re-run."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/tokenprinter.keystore

      - name: Bundle a backup copy of the page (used only if the live site can't load)
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk TokenPrinter.apk

      - name: Publish to the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Token Printer Android app
          body: |
            Latest build of the Token Printer Android app (build ${{ github.run_number }}).
            On your phone, download TokenPrinter.apk below and open it to install or update.
          files: TokenPrinter.apk
          make_latest: true

      - name: Keep a copy with this run too
        uses: actions/upload-artifact@v4
        with:
          name: TokenPrinter-apk
          path: TokenPrinter.apk
