<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16201c">
<title>Token Printer</title>
<style>
/* Layout: one phone-width column — search, quick picks, results grid, then a sticky print panel. */
:root {
  --bg: #16201c;        /* table felt */
  --surface: #1f2b26;
  --line: #34443d;
  --fg: #e8ece9;
  --muted: #9aaba3;
  --accent: #c9a24a;    /* brass */
  --accent-ink: #1a1408;
  --danger: #e27a6a;
  --paper: #fbfbf8;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Georgia", "Times New Roman", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9eeeb; --surface: #ffffff; --line: #c9d3ce; --fg: #18231e; --muted: #56665e;
  --accent: #7a5c14; --accent-ink: #ffffff; --danger: #b2402e; --paper: #fbfbf8; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #e9eeeb; --surface: #ffffff; --line: #c9d3ce; --fg: #18231e; --muted: #56665e;
  --accent: #7a5c14; --accent-ink: #ffffff; --danger: #b2402e; --paper: #fbfbf8; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 700 1.5rem/1.1 var(--font-display); margin: 0; letter-spacing: .01em; }
.hint { color: var(--muted); font-size: .85rem; }

.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); padding: 10px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
#mic { width: 52px; padding: 0; font-size: 1.3rem; }
#mic.listening { background: var(--danger); border-color: var(--danger); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; font-size: .9rem; }
.chip.learned { border-color: var(--accent); }
.labelrow { display: flex; align-items: center; justify-content: space-between; }
.linkbtn { border: 0; background: none; padding: 2px 4px; color: var(--muted); font-size: .72rem;
  text-transform: uppercase; letter-spacing: .08em; text-decoration: underline; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }

#status { min-height: 1.4em; color: var(--muted); font-size: .9rem; }
#status.err { color: var(--danger); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.result { padding: 0; overflow: hidden; display: grid; text-align: left; border-radius: 8px; }
.result img { width: 100%; aspect-ratio: 488/680; object-fit: cover; display: block; background: var(--line); }
.result span { padding: 6px 8px; font-size: .8rem; line-height: 1.2; }
.result.selected { outline: 3px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.preview { background: var(--paper); border-radius: 6px; padding: 10px; display: flex; justify-content: center; }
.preview canvas { width: 100%; max-width: 288px; height: auto; image-rendering: pixelated; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty input { width: 3.5em; text-align: center; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 9px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); -moz-appearance: textfield; }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.artrow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; color: var(--muted); font-size: .9rem; }
.artrow button { flex: 0 0 72px; padding: 0; border-radius: 6px; overflow: hidden; }
.artrow img { width: 100%; display: block; aspect-ratio: 488/680; object-fit: cover; background: var(--line); }
.artrow button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.adj { display: grid; grid-template-columns: auto 1fr 3ch; gap: 6px 10px; align-items: center; font-size: .9rem; color: var(--muted); }
.adj input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
.adj output { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
.adj button { grid-column: 1 / -1; justify-self: start; padding: 6px 12px; font-size: .85rem; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.actions .primary { padding: 14px; font-size: 1.05rem; }
.custom { display: grid; gap: 8px; grid-template-columns: 1fr 64px 64px; }
.custom input, .custom textarea { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); min-width: 0; }
.custom textarea { grid-column: 1 / -1; min-height: 60px; resize: vertical; }
.custom button { grid-column: 1 / -1; }
details summary { cursor: pointer; color: var(--muted); }

/* App-only bits (shown when running inside the Android app) */
.toggle { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.printer { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .9rem; }
.printer b { color: var(--fg); font-weight: 600; }
.printer button { padding: 6px 12px; font-size: .85rem; }
.settings { display: grid; gap: 12px; margin-top: 10px; padding: 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; }
.settings label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.settings select { font: inherit; font-size: 1rem; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); min-width: 0; }
.settings .why { font-size: .78rem; color: var(--muted); }
.settings .row button { flex: 1; }
#countdown { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(608px, calc(100% - 32px));
  padding: 14px 16px 16px; text-align: left; overflow: hidden; font-weight: 700; font-size: 1.05rem;
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
#countdown small { display: block; font-weight: 500; font-size: .85rem; opacity: .8; }
#countdown .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent-ink); transform-origin: left; }
#countdown.run .fill { animation: drain var(--dur, 2s) linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Token Printer</h1>
    <span class="hint">58mm · 384 dots</span>
  </header>

  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="2/2 zombie, treasure, 1/1 white soldier…" autocomplete="off" enterkeyhint="search">
    <button id="mic" type="button" aria-label="Say a token">🎙</button>
  </form>

  <div>
    <div class="label labelrow">Quick picks <button type="button" class="linkbtn" id="resetPicks" hidden>Reset</button></div>
    <div class="chips" id="quick"></div>
  </div>
  <label class="toggle" id="autoWrap" hidden>
    <input type="checkbox" id="autoPrint"> Auto-print what I say
  </label>
  <div id="recentWrap" hidden>
    <div class="label">Recently printed</div>
    <div class="chips" id="recent"></div>
  </div>

  <div id="status" role="status"></div>
  <div class="grid" id="results"></div>

  <details>
    <summary>Make a custom token</summary>
    <div class="custom" style="margin-top:10px">
      <input id="cName" placeholder="Name (e.g. Copy of Grolnok)">
      <input id="cP" placeholder="P" inputmode="numeric">
      <input id="cT" placeholder="T" inputmode="numeric">
      <input id="cType" placeholder="Type line (e.g. Creature — Frog)" style="grid-column:1/-1">
      <textarea id="cText" placeholder="Abilities"></textarea>
      <button type="button" id="cMake">Use custom token</button>
    </div>
  </details>

  <details id="settingsBox" hidden>
    <summary>Printer settings</summary>
    <div class="settings">
      <div class="printer">
        <span>Printer: <b id="printerName2">not picked yet</b></span>
        <button type="button" id="changePrinter2">Change</button>
      </div>
      <label class="field">Connection method
        <select id="setConnect">
          <option value="auto">Automatic (tries each)</option>
          <option value="secure">Standard serial (SPP)</option>
          <option value="insecure">Serial without pairing check</option>
          <option value="channel1">Direct channel 1</option>
        </select>
      </label>
      <label class="field">Image command
        <select id="setMode">
          <option value="raster">Raster, GS v 0 (most printers)</option>
          <option value="escstar">Bit image, ESC * (Epson style)</option>
        </select>
        <span class="why">Switch this if prints come out as garbage characters or nothing.</span>
      </label>
      <label class="field">Rows sent at a time
        <select id="setBand">
          <option value="24">24</option><option value="48">48</option><option value="96">96</option>
          <option value="128">128</option><option value="255">255</option>
        </select>
      </label>
      <label class="field">Pause between chunks
        <select id="setDelay">
          <option value="0">None</option><option value="5">5 ms</option><option value="10">10 ms</option>
          <option value="20">20 ms</option><option value="40">40 ms</option>
        </select>
        <span class="why">Smaller chunks and a short pause help if prints come out garbled or cut off.</span>
      </label>
      <label class="field">Darkness
        <select id="setHeat">
          <option value="0">Printer default</option><option value="60">Lighter</option><option value="80">Normal</option>
          <option value="120">Darker</option><option value="160">Darkest (slower)</option>
        </select>
      </label>
      <label class="field">Blank lines after each print
        <select id="setFeed">
          <option value="0">0</option><option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option><option value="6">6</option>
        </select>
      </label>
      <label class="field">Several copies
        <select id="setCopies">
          <option value="0">One strip with cut lines</option>
          <option value="2">One at a time, 2 s to tear</option>
          <option value="3">One at a time, 3 s to tear</option>
          <option value="5">One at a time, 5 s to tear</option>
          <option value="8">One at a time, 8 s to tear</option>
        </select>
        <span class="why">The countdown starts once each token has finished printing. Tap the bar to stop the rest.</span>
      </label>
      <label class="toggle"><input type="checkbox" id="setKeep"> Stay connected between prints (faster)</label>
      <div class="row">
        <button type="button" id="testPrint">Print test page</button>
        <button type="button" id="resetSettings">Reset to defaults</button>
      </div>
    </div>
  </details>

  <section class="panel" id="panel" hidden>
    <div class="preview"><canvas id="cv" width="384" height="536"></canvas></div>
    <div class="artrow" id="artRow" hidden></div>
    <div class="adj" id="adj">
      <label for="bright">Brightness</label>
      <input id="bright" type="range" min="-50" max="50" step="1" value="0">
      <output id="brightVal">0</output>
      <label for="contrast">Contrast</label>
      <input id="contrast" type="range" min="-50" max="50" step="1" value="0">
      <output id="contrastVal">0</output>
      <button type="button" id="adjReset">Reset</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Print style">
        <button type="button" id="styleArt" aria-pressed="true">Art</button>
        <button type="button" id="styleText" aria-pressed="false">Text</button>
      </div>
      <button type="button" id="moreArt">Other art</button>
      <div class="qty">
        <button type="button" id="minus" aria-label="Fewer">−</button>
        <input id="qty" type="number" inputmode="numeric" min="1" max="20" value="1" aria-label="Number of copies">
        <button type="button" id="plus" aria-label="More">+</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="print">Print</button>
      <button type="button" id="save">Save image</button>
    </div>
    <button type="button" id="rawbt">Send straight to RawBT (experimental)</button>
    <div class="printer" id="printerRow" hidden>
      <span>Printer: <b id="printerName">not picked yet</b></span>
      <button type="button" id="changePrinter">Change</button>
    </div>
  </section>
</div>

<button type="button" id="countdown" hidden>
  <span id="cdText">Printing…</span>
  <small>Tap to cancel</small>
  <span class="fill"></span>
</button>

<script>
(() => {
  const W = 384;                 // printable dots on 58mm paper (48mm × 8 dots/mm)
  const H_ART = 536;             // keeps a real card's 63×88 proportions
  const $ = id => document.getElementById(id);
  const state = { token: null, style: 'art', qty: 1, artImg: null, adj: { bright: 0, contrast: 0 },
                  ready: Promise.resolve(), readyResolve: null };
  // Present only inside the Android app: prints over Bluetooth and listens with Android's own speech recognizer
  const NATIVE = window.TokenPrinterNative || null;

  // ---------- storage (best effort) ----------
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- natural-language → Scryfall query ----------
  const NUM = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
  const COLORS = {white:'w',blue:'u',black:'b',red:'r',green:'g'};
  const KEYWORDS = ['flying','vigilance','lifelink','deathtouch','haste','trample','reach','menace','defender',
    'indestructible','hexproof','prowess','ward','first_strike','double_strike'];
  const STOP = new Set(['a','an','the','token','tokens','creature','creatures','with','and','i','need','print','me',
    'give','make','of','please','times','copies','copy','get','want','some','by','for','that','has']);
  const IRREG = {elves:'elf', wolves:'wolf', dwarves:'dwarf', mice:'mouse', octopi:'octopus',
    zombies:'zombie', faeries:'faerie', pixies:'pixie', zombi:'zombie'};

  function singular(w) {
    if (IRREG[w]) return IRREG[w];
    if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
    if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
    return w;
  }

  // Speech often hears "two two" as "tutu", "to to" or "22", and "one one" as "11" or "won won".
  // splitPairs=false is the fallback reading where "11" really means eleven.
  function parse(raw, splitPairs = true) {
    let s = ' ' + raw.toLowerCase() + ' ';
    s = s.replace(/first strike/g, 'first_strike').replace(/double strike/g, 'double_strike');
    s = s.replace(/\btu ?tu\b/g, ' 2 2 ').replace(/\b(to|too|tu)\b/g, ' 2 ').replace(/\bwon\b/g, ' 1 ');
    s = s.replace(/\bfor\s+for\b/g, ' 4 4 ').replace(/\b(fore|for)(?=\s+(\d|one|two|three|four|five|six|seven|eight|nine)\b)/g, ' 4 ')
         .replace(/(\d|one|two|three|five|six|seven|eight|nine)\s+(fore|for)\b/g, '$1 4 ');
    if (splitPairs && !/\d\s*\/\s*\d/.test(s)) {
      s = s.replace(/\b(\d)(\d)(\d)\b/g, ' $1 $2 $3 ');   // "322 zombies" → 3 × 2/2 (nobody needs 322 tokens)
      s = s.replace(/\b(\d)\1\b/g, ' $1 $1 ');            // "22 zombie" → 2/2
    }
    s = s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g, m => NUM[m]);
    const out = { qty: null, p: null, t: null, colors: [], colorless: false, kw: [], words: [] };
    const slash = s.match(/(\d+|x)\s*\/\s*(\d+|x)/);
    let nums;
    if (slash) {
      out.p = slash[1]; out.t = slash[2];
      s = s.replace(slash[0], ' ');
      nums = s.match(/\d+/g) || [];
      if (nums.length) out.qty = +nums[0];
    } else {
      nums = s.match(/\d+/g) || [];
      if (nums.length >= 3) { out.qty = +nums[0]; out.p = nums[1]; out.t = nums[2]; }
      else if (nums.length === 2) { out.p = nums[0]; out.t = nums[1]; }
      else if (nums.length === 1) { out.qty = +nums[0]; }
    }
    s = s.replace(/\d+/g, ' ');
    for (const w of s.split(/[^a-z_]+/).filter(Boolean)) {
      if (STOP.has(w)) continue;
      if (COLORS[w]) { out.colors.push(COLORS[w]); continue; }
      if (w === 'colorless') { out.colorless = true; continue; }
      if (KEYWORDS.includes(w)) { out.kw.push(w.replace('_', ' ')); continue; }
      out.words.push(singular(w));
    }
    return out;
  }

  // What the app took a spoken request to mean, in plain words
  const CNAME = {w:'white', u:'blue', b:'black', r:'red', g:'green'};
  function understood(p) {
    return [p.qty, p.p != null ? `${p.p}/${p.t}` : null, ...p.colors.map(c => CNAME[c]),
      p.colorless ? 'colorless' : null, ...p.words, ...p.kw].filter(x => x != null && x !== '').join(' ');
  }

  function toQuery(p, typed) {
    const q = ['t:token'];
    if (p.p != null) q.push('pow=' + p.p);
    if (p.t != null) q.push('tou=' + p.t);
    if (p.colors.length) q.push('c=' + p.colors.join(''));
    if (p.colorless) q.push('c=c');
    for (const k of p.kw) q.push(`o:"${k}"`);
    for (const w of p.words) q.push(typed ? 't:' + w : w);
    return q.join(' ');
  }

  // ---------- Scryfall ----------
  async function scryfall(q) {
    const url = 'https://api.scryfall.com/cards/search?unique=cards&order=name&q=' + encodeURIComponent(q);
    const r = await fetch(url);
    if (r.status === 404) return [];
    if (!r.ok) throw new Error('Scryfall returned ' + r.status);
    const j = await r.json();
    return j.data || [];
  }

  // Split double-sided token cards (e.g. "Treasure // Zombie") into separate sides
  function faces(c) {
    const list = (c.card_faces && c.card_faces.length > 1) ? c.card_faces : [c];
    return list.map(f => {
      const im = f.image_uris || c.image_uris || {};
      return { name: f.name, type: f.type_line || c.type_line || '', text: f.oracle_text || '',
        p: f.power ?? null, t: f.toughness ?? null, colors: f.colors || c.colors || [],
        thumb: im.small || im.normal || '', art: im.art_crop || '' };
    });
  }

  function matches(tok, p) {
    const hay = (tok.name + ' ' + tok.type).toLowerCase();
    if (p.p != null && String(tok.p).toLowerCase() !== p.p) return false;
    if (p.t != null && String(tok.t).toLowerCase() !== p.t) return false;
    for (const w of p.words) if (!hay.includes(w)) return false;
    const txt = tok.text.toLowerCase();
    for (const k of p.kw) if (!txt.includes(k)) return false;
    return true;
  }

  // Keep only the sides that match, drop duplicates, closest match first
  function pickTokens(cards, p) {
    const all = cards.flatMap(faces);
    let list = all.filter(t => matches(t, p));
    if (!list.length) list = all;
    const seen = new Set();
    list = list.filter(t => { const k = [t.name, t.p, t.t, t.text].join('|'); if (seen.has(k)) return false; seen.add(k); return true; });
    const want = p.words.join(' ');
    const score = t => (t.name.toLowerCase() === want ? 0 : 1000) + t.text.length;
    return list.sort((a, b) => score(a) - score(b));
  }

  let searchSeq = 0;
  async function search(raw, opts = {}) {
    raw = raw.trim();
    if (!raw) return;
    copyRun++;                   // a new request stops any copy-by-copy run in progress
    cancelCountdown();
    const seq = ++searchSeq;
    let p = parse(raw);
    state.token = null; state.artImg = null; $('panel').hidden = true;   // no stale preview while searching
    setStatus('Searching…');
    try {
      let cards = await scryfall(toQuery(p, true));
      if (!cards.length && p.words.length) cards = await scryfall(toQuery(p, false)); // names like "Marit Lage"
      const plain = parse(raw, false);   // nothing for "11 treasure" as 1/1? then it meant eleven
      if (!cards.length && JSON.stringify(plain) !== JSON.stringify(p)) {
        p = plain;
        cards = await scryfall(toQuery(p, true));
        if (!cards.length && p.words.length) cards = await scryfall(toQuery(p, false));
      }
      if (seq === searchSeq && p.qty) setQty(Math.min(p.qty, 20));
      if (seq === searchSeq && opts.voice) $('q').value = understood(p);   // "tutu zombie" → "2/2 zombie"
      if (seq !== searchSeq) return;
      const tokens = pickTokens(cards, p);
      renderResults(tokens);
      if (!tokens.length) setStatus(`No tokens matched "${raw}". Try fewer words, or make a custom token below.`, true);
      else {
        const want = p.words.join(' ');
        const exact = tokens.filter(t => t.name.toLowerCase() === want);
        // Typing: only auto-pick an obvious match. Voice: always pick one — the version you print
        // most if it's among the matches, otherwise the plainest (results are sorted that way).
        const usual = opts.voice ? favorite(tokens) : null;
        const pick = usual || tokens[0];
        const auto = opts.voice || tokens.length === 1 || (exact.length === 1 && tokens[0] === exact[0]);
        if (auto) {
          const others = tokens.length - 1;
          setStatus(!others ? 'Found it. Ready to print.'
            : `Picked ${usual ? 'your usual ' : ''}${chipLabel(pick)}. ${others} other match${others === 1 ? '' : 'es'} below — tap one to switch.`);
          $('results').children[tokens.indexOf(pick)]?.classList.add('selected');
          select(pick);
          if (opts.voice && NATIVE && autoPrintOn())
            armAutoPrint(seq, others ? (usual ? '(your usual)' : `(1 of ${tokens.length} matches)`) : '');
        } else {
          setStatus(`${tokens.length} tokens found. Tap one to preview and print.`);
        }
      }
    } catch (e) {
      if (seq !== searchSeq) return;
      setStatus("Couldn't reach Scryfall. Check your connection, or make a custom token below.", true);
    }
  }

  function setStatus(msg, err) { const el = $('status'); el.textContent = msg; el.className = err ? 'err' : ''; }

  function renderResults(list) {
    const g = $('results'); g.innerHTML = '';
    list.slice(0, 60).forEach(tok => {
      const b = document.createElement('button');
      b.className = 'result'; b.type = 'button';
      b.innerHTML = `<img loading="lazy" alt=""><span></span>`;
      b.querySelector('img').src = tok.thumb;
      b.querySelector('span').textContent = (tok.p != null ? `${tok.p}/${tok.t} ` : '') + tok.name;
      b.onclick = () => { cancelCountdown(); document.querySelectorAll('.result.selected').forEach(x => x.classList.remove('selected'));
                          b.classList.add('selected'); select(tok); };
      g.appendChild(b);
    });
  }

  // ---------- selection & preview ----------
  // Same token = same name and P/T (wording of reminder text varies between printings)
  const artKey = t => [t.name, t.p, t.t].join('|');

  // state.ready settles once the selected token's art has loaded (or failed), so auto-print waits for the real preview
  const markReady = () => state.readyResolve?.();

  function loadArt(tok) {
    state.artImg = null;
    if (!tok.art) { markReady(); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { if (state.token === tok) { state.artImg = img; draw(); markReady(); } };
    img.onerror = () => { if (state.token === tok) { $('styleArt').disabled = true; setStyle('text'); markReady(); } };
    img.src = tok.art;
  }

  function select(tok) {
    tok = { ...tok };
    const saved = store.get('art', {})[artKey(tok)];
    if (saved) { tok.art = saved.art; tok.thumb = saved.thumb; }
    state.token = tok; state.artImg = null;
    state.ready = new Promise(res => { state.readyResolve = res; setTimeout(res, 6000); });  // don't wait forever on slow art
    $('panel').hidden = false;
    $('artRow').hidden = true; $('artRow').innerHTML = '';
    $('moreArt').hidden = !tok.art;
    setStyle(tok.art ? state.style : 'text');
    $('styleArt').disabled = !tok.art;
    loadArt(tok);
    draw();
    $('panel').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  async function showArts() {
    const tok = state.token; if (!tok) return;
    const row = $('artRow');
    if (!row.hidden && row.querySelector('button')) { row.hidden = true; return; }   // tap again to close
    row.hidden = false; row.textContent = 'Loading art…';
    const q = ['t:token', `name:"${tok.name.replace(/"/g, '')}"`];
    if (tok.p != null) q.push('pow=' + tok.p);
    if (tok.t != null) q.push('tou=' + tok.t);
    try {
      const r = await fetch('https://api.scryfall.com/cards/search?unique=art&order=released&dir=desc&q=' + encodeURIComponent(q.join(' ')));
      const j = r.ok ? await r.json() : { data: [] };
      if (state.token !== tok) return;
      const seen = new Set();
      const arts = (j.data || []).flatMap(faces)
        .filter(f => artKey(f) === artKey(tok) && f.art && !seen.has(f.art) && seen.add(f.art));
      row.innerHTML = '';
      if (arts.length <= 1) { row.textContent = 'This is the only art Scryfall has for this token.'; return; }
      arts.forEach(a => {
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('aria-pressed', a.art === tok.art); b.setAttribute('aria-label', 'Use this art');
        b.innerHTML = '<img alt="" loading="lazy">'; b.querySelector('img').src = a.thumb;
        b.onclick = () => {
          tok.art = a.art; tok.thumb = a.thumb;
          const m = store.get('art', {}); m[artKey(tok)] = { art: a.art, thumb: a.thumb }; store.set('art', m);
          row.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
          setStyle('art'); loadArt(tok);
        };
        row.appendChild(b);
      });
    } catch { if (state.token === tok) row.textContent = "Couldn't load other art. Check your connection."; }
  }

  function setStyle(s) {
    state.style = s;
    $('styleArt').setAttribute('aria-pressed', s === 'art');
    $('styleText').setAttribute('aria-pressed', s === 'text');
    $('adj').hidden = s !== 'art';
    draw();
  }
  function setQty(n) { n = parseInt(n, 10); state.qty = Math.max(1, Math.min(20, isNaN(n) ? 1 : n)); $('qty').value = state.qty; }

  const COLOR_NAMES = {W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
  const colorWord = c => c.length ? c.map(x => COLOR_NAMES[x] || x).join('-') : 'Colorless';

  function wrap(ctx, text, maxW) {
    const lines = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; }
        else line = test;
      }
      lines.push(line);
    }
    return lines;
  }

  // Render one token onto a fresh canvas (pure black/white, 384 wide)
  function renderToken(tok, style, artImg) {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const F = 'bold {s}px system-ui, Roboto, Arial, sans-serif';
    const R = '{s}px system-ui, Roboto, Arial, sans-serif';
    const font = (tpl, s) => tpl.replace('{s}', s);
    const hasPT = tok.p != null && tok.t != null;
    const typeLine = `${colorWord(tok.colors)} · ${tok.type.replace(/^Token\s+/, '')}`;

    if (style === 'art' && artImg) {
      c.width = W; c.height = H_ART;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H_ART);
      ctx.fillStyle = '#000';
      ctx.font = font(F, 32); ctx.textBaseline = 'top';
      ctx.fillText(fit(ctx, tok.name, W - 24), 12, 12);
      ctx.font = font(F, 18); ctx.fillText(fit(ctx, typeLine, W - 24), 12, 50);   // bold so it survives thermal printing
      // rules text first, so the art can take whatever height is left
      ctx.font = font(R, 20);
      const lines = tok.text ? wrap(ctx, tok.text, W - 24).slice(0, 6) : [];
      const LH = 24;
      const textH = lines.length ? lines.length * LH + 12 : 0;
      const ptReserve = hasPT && lines.length ? 58 : 0;       // P/T sits under the text when there is text
      const ax = 8, ay = 78, aw = W - 16;
      const ah = Math.max(200, H_ART - 10 - ay - textH - ptReserve);
      drawDithered(ctx, artImg, ax, ay, aw, ah);
      ctx.lineWidth = 3; ctx.strokeRect(ax, ay, aw, ah);
      let y = ay + ah + 12;
      for (const ln of lines) { ctx.fillText(ln, 12, y); y += LH; }
      if (hasPT) {
        if (lines.length) ptBox(ctx, `${tok.p}/${tok.t}`, W - 12, H_ART - 12, 40);
        else {
          // no rules text: art runs to the bottom and the P/T sits on its corner with a white outline
          ctx.font = 'bold 40px system-ui, Roboto, Arial, sans-serif';
          const txt = `${tok.p}/${tok.t}`, tw = ctx.measureText(txt).width, pad = 12;
          const bw = tw + pad * 2, bh = 40 + pad * 1.4, bx = W - 14 - bw, by = ay + ah - 6 - bh;
          ctx.fillStyle = '#fff'; roundRect(ctx, bx - 4, by - 4, bw + 8, bh + 8, 12); ctx.fill(); ctx.fillStyle = '#000';
          ptBox(ctx, txt, bx + bw, by + bh, 40);
        }
      }
      ctx.lineWidth = 4; roundRect(ctx, 2, 2, W - 4, H_ART - 4, 14); ctx.stroke();
    } else {
      // text style: height grows with content
      const meas = document.createElement('canvas').getContext('2d');
      meas.font = font(F, 52); const nameLines = wrap(meas, tok.name, W - 32);
      meas.font = font(R, 22); const typeLines = wrap(meas, typeLine, W - 32);
      meas.font = font(R, 26); const textLines = tok.text ? wrap(meas, tok.text, W - 32) : [];
      const h = 20 + nameLines.length * 58 + 8 + typeLines.length * 28 + 14 + textLines.length * 32 + (hasPT ? 110 : 20) + 10;
      c.width = W; c.height = Math.max(h, 260);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height);
      ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
      let y = 20;
      ctx.font = font(F, 52); nameLines.forEach(l => { ctx.fillText(l, 16, y); y += 58; });
      y += 8; ctx.font = font(R, 22); typeLines.forEach(l => { ctx.fillText(l, 16, y); y += 28; });
      y += 6; ctx.fillRect(16, y, W - 32, 3); y += 12;
      ctx.font = font(R, 26); textLines.forEach(l => { ctx.fillText(l, 16, y); y += 32; });
      if (hasPT) ptBox(ctx, `${tok.p}/${tok.t}`, W - 16, c.height - 16, 72);
      ctx.lineWidth = 4; roundRect(ctx, 2, 2, W - 4, c.height - 4, 14); ctx.stroke();
    }
    threshold(ctx, c.width, c.height);
    return c;
  }

  function fit(ctx, text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function ptBox(ctx, txt, right, bottom, size) {
    ctx.font = `bold ${size}px system-ui, Roboto, Arial, sans-serif`;
    const tw = ctx.measureText(txt).width, pad = size * 0.3;
    const bw = tw + pad * 2, bh = size + pad * 1.2;
    ctx.fillStyle = '#000'; roundRect(ctx, right - bw, bottom - bh, bw, bh, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'top'; ctx.fillText(txt, right - bw + pad, bottom - bh + pad * 0.6);
    ctx.fillStyle = '#000';
  }

  // Cover-fit the art, then Floyd–Steinberg dither it to 1-bit like the print head will
  function drawDithered(ctx, img, x, y, w, h) {
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    const oc = o.getContext('2d');
    const s = Math.max(w / img.width, h / img.height);
    const dw = img.width * s, dh = img.height * s;
    oc.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const d = oc.getImageData(0, 0, w, h), px = d.data;
    const n = w * h, g = new Float32Array(n), hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const v = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];
      g[i] = v; hist[v | 0]++;
    }
    // Auto-levels: stretch the 2nd–98th percentile to full range so light or dark art keeps detail
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.02) { hi = v; break; } }
    const range = Math.max(hi - lo, 1);
    const cf = 1 + state.adj.contrast / 50;      // 0 … 2
    const bo = state.adj.bright / 100;           // −0.5 … +0.5
    for (let i = 0; i < n; i++) {
      let v = Math.min(1, Math.max(0, (g[i] - lo) / range));
      v = Math.min(1, Math.max(0, (v - 0.5) * cf + 0.5 + bo));
      g[i] = 255 * Math.pow(v, 0.85);       // slight lift of midtones; thermal heads print dark
    }
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      const i = yy * w + xx, old = g[i], nv = old < 128 ? 0 : 255, err = old - nv;
      g[i] = nv;
      if (xx + 1 < w) g[i + 1] += err * 7 / 16;
      if (yy + 1 < h) { if (xx > 0) g[i + w - 1] += err * 3 / 16; g[i + w] += err * 5 / 16; if (xx + 1 < w) g[i + w + 1] += err / 16; }
    }
    for (let i = 0; i < w * h; i++) { px[i*4] = px[i*4+1] = px[i*4+2] = g[i]; px[i*4+3] = 255; }
    oc.putImageData(d, 0, 0);
    ctx.drawImage(o, x, y);
  }
  function threshold(ctx, w, h) {
    const d = ctx.getImageData(0, 0, w, h), px = d.data;
    for (let i = 0; i < px.length; i += 4) { const v = px[i] < 128 ? 0 : 255; px[i] = px[i+1] = px[i+2] = v; px[i+3] = 255; }
    ctx.putImageData(d, 0, 0);
  }

  function draw() {
    if (!state.token) return;
    const style = state.style === 'art' && state.artImg ? 'art' : 'text';
    let src;
    try { src = renderToken(state.token, style, state.artImg); }
    catch { $('styleArt').disabled = true; src = renderToken(state.token, 'text', null); }
    const cv = $('cv'); cv.width = src.width; cv.height = src.height;
    cv.getContext('2d').drawImage(src, 0, 0);
  }

  // Stack N copies with a dashed cut line between them
  function sheet(n = state.qty) {
    const one = $('cv'), gap = 40;
    const c = document.createElement('canvas');
    c.width = W; c.height = one.height * n + gap * (n - 1) + 60;  // trailing feed so the last token clears the tear bar
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < n; i++) {
      const y = i * (one.height + gap);
      ctx.drawImage(one, 0, y);
      if (i < n - 1) { ctx.fillStyle = '#000'; for (let x = 0; x < W; x += 16) ctx.fillRect(x, y + one.height + gap / 2, 8, 2); }
    }
    return c;
  }

  function remember() {
    const t = state.token; if (!t) return;
    let rec = store.get('recent', []).filter(r => !(r.name === t.name && r.p === t.p && r.t === t.t && r.text === t.text));
    rec.unshift(t); rec = rec.slice(0, 8); store.set('recent', rec); renderRecent();
    // Tally prints per token (same name + P/T) so the most-used ones become quick picks
    const counts = store.get('counts', {}), k = artKey(t);
    counts[k] = { token: t, n: (counts[k]?.n || 0) + 1, last: Date.now() };
    store.set('counts', counts); renderQuick();
  }
  function renderRecent() {
    const rec = store.get('recent', []);
    $('recentWrap').hidden = !rec.length;
    const box = $('recent'); box.innerHTML = '';
    rec.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
      b.textContent = (t.p != null ? `${t.p}/${t.t} ` : '') + t.name; b.onclick = () => select(t); box.appendChild(b); });
  }

  const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
  const fileName = () => (state.token.name || 'token').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';

  // ---------- printing inside the Android app ----------
  // Pack the black/white sheet into 1 bit per dot (MSB first, 1 = black) — the format ESC/POS raster printing wants
  function packBits(c) {
    const w = c.width, h = c.height, wb = Math.ceil(w / 8);
    const px = c.getContext('2d').getImageData(0, 0, w, h).data;
    const out = new Uint8Array(wb * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
      if (px[(y * w + x) * 4] < 128) out[y * wb + (x >> 3)] |= 0x80 >> (x & 7);
    let s = '';
    for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
    return { b64: btoa(s), wb, h };
  }

  // Printer settings, saved on this phone and sent with every print
  const PDEF = { connect: 'auto', mode: 'raster', bandRows: 128, bandDelayMs: 0, heat: 0, feedLines: 2, keepConnected: true,
                 tearSeconds: 3 };
  let pset = Object.assign({}, PDEF, store.get('printerSettings', {}));
  const PFIELDS = { setConnect: 'connect', setMode: 'mode', setBand: 'bandRows', setDelay: 'bandDelayMs', setHeat: 'heat', setFeed: 'feedLines',
                    setCopies: 'tearSeconds' };
  function showSettings() {
    for (const [id, k] of Object.entries(PFIELDS)) $(id).value = String(pset[k]);
    $('setKeep').checked = pset.keepConnected;
  }
  function readSettings() {
    for (const [id, k] of Object.entries(PFIELDS)) pset[k] = typeof PDEF[k] === 'number' ? +$(id).value : $(id).value;
    pset.keepConnected = $('setKeep').checked;
    store.set('printerSettings', pset);
    NATIVE?.disconnect?.();    // reconnect fresh with the new settings on the next print
  }

  const waiting = {};            // print id → resolver, settled when the app reports back
  let printSeq = 0;
  function nativePrint(canvas) {
    return new Promise(resolve => {
      const id = 'p' + (++printSeq);
      waiting[id] = resolve;
      const { b64, wb, h } = packBits(canvas);
      if (NATIVE.printWith) NATIVE.printWith(id, b64, wb, h, JSON.stringify(pset));
      else NATIVE.print(id, b64, wb, h);           // older app without settings support
    });
  }
  const failText = r => (r.message || "Couldn't print. Check the printer is on and try again.") + (r.detail ? ` (Details: ${r.detail})` : '');

  // A page that shows what the settings do: text, solid black, a gray ramp, and fine lines
  function testSheet() {
    const c = document.createElement('canvas'); c.width = W; c.height = 330;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height); ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
    ctx.font = 'bold 30px system-ui, Roboto, Arial, sans-serif'; ctx.fillText('Token Printer test', 12, 12);
    ctx.font = '17px system-ui, Roboto, Arial, sans-serif';
    const heatName = { 0: 'default', 60: 'lighter', 80: 'normal', 120: 'darker', 160: 'darkest' }[pset.heat] || pset.heat;
    ctx.fillText(`${pset.mode === 'raster' ? 'GS v 0' : 'ESC *'} · ${pset.bandRows} rows · ${pset.bandDelayMs} ms · darkness ${heatName}`, 12, 52);
    ctx.fillText(`Connection: ${pset.connect} · ${new Date().toLocaleString()}`, 12, 74);
    ctx.fillRect(12, 104, W - 24, 36);                                     // solid black: shows banding
    const B = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    for (let s = 0; s < 8; s++) {                                         // 8-step gray ramp
      const x0 = 12 + s * 45, level = (s + 0.5) / 8;
      for (let y = 152; y < 200; y++) for (let x = x0; x < x0 + 42; x++)
        if (B[y & 3][x & 3] / 16 < level) ctx.fillRect(x, y, 1, 1);
    }
    for (let i = 0; i < 6; i++) ctx.fillRect(12, 214 + i * 6, W - 24, 1 + (i >> 1));   // fine lines
    for (let x = 12; x < W - 12; x += 8) ctx.fillRect(x, 254, 1, x % 48 === 12 ? 18 : 8);  // ruler
    ctx.font = 'bold 22px system-ui, Roboto, Arial, sans-serif'; ctx.fillText('1/1  2/2  3/3  4/4', 12, 284);
    ctx.lineWidth = 3; roundRect(ctx, 2, 2, W - 4, c.height - 4, 12); ctx.stroke();
    threshold(ctx, W, c.height);
    return c;
  }
  async function printTest() {
    setStatus('Printing test page…');
    $('testPrint').disabled = true;
    const r = await nativePrint(testSheet());
    $('testPrint').disabled = false;
    setStatus(r.ok ? 'Test page sent.' : failText(r), !r.ok);
  }
  const tokenLabel = () => (state.qty > 1 ? state.qty + '× ' : '') + chipLabel(state.token);

  // The app reports back once the data is sent, but the head is still printing it.
  // Rough print time: ~1 s per 400 rows of paper, plus a moment for the motor to stop.
  const printSeconds = rows => 0.6 + rows / 400;
  let copyRun = 0;               // bumping this stops a copy-by-copy run in progress

  async function printNow() {
    if (!state.token) return;
    const label = tokenLabel(), n = state.qty, pause = +pset.tearSeconds || 0;
    remember();
    $('print').disabled = true;
    if (n < 2 || !pause) {
      setStatus(`Printing ${label}…`);
      const r = await nativePrint(sheet());
      $('print').disabled = false;
      if (r.ok) setStatus(`Printed ${label}.`);
      else setStatus(failText(r), true);
      return;
    }
    // One token per print, with time to tear between them
    const run = ++copyRun, one = sheet(1), name = chipLabel(state.token);
    for (let i = 1; i <= n; i++) {
      setStatus(`Printing ${name}, ${i} of ${n}…`);
      const r = await nativePrint(one);
      if (run !== copyRun) break;
      if (!r.ok) { setStatus(failText(r) + (i > 1 ? ` ${i - 1} of ${n} printed.` : ''), true); break; }
      if (i === n) { setStatus(`Printed ${n}× ${name}.`); break; }
      await new Promise(res => setTimeout(res, printSeconds(one.height) * 1000));   // let the head finish
      if (run !== copyRun) break;
      const go = await tearPause(`Tear off ${i} of ${n}`, `Next one in`, pause, run);
      if (go === 'tapped') { setStatus(`Stopped after ${i} of ${n}. Tap Print to start again.`); break; }
      if (!go) break;            // a new search or print took over; leave its status alone
    }
    $('print').disabled = false;
  }

  // Countdown bar between copies; resolves false if tapped (stop) or another print/search starts
  function tearPause(title, lead, seconds, run) {
    return new Promise(resolve => {
      const bar = $('countdown'), end = Date.now() + seconds * 1000;
      let tick;
      const finish = ok => { clearInterval(tick); bar.hidden = true; bar.onclick = defaultBarClick;
        bar.classList.remove('run'); resolve(ok); };
      const show = () => {
        if (run !== copyRun) return finish(false);
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        $('cdText').textContent = `${title} · ${lead} ${left}s`;
        if (Date.now() >= end) finish(true);
      };
      bar.querySelector('small').textContent = 'Tap to stop the rest';
      bar.style.setProperty('--dur', seconds + 's');
      bar.hidden = false;
      bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
      bar.onclick = () => { copyRun++; finish('tapped'); };
      show(); tick = setInterval(show, 200);
    });
  }

  // Messages from the app arrive here
  window.__tp = (kind, json) => {
    let d = {}; try { d = JSON.parse(json); } catch {}
    if (kind === 'voice') onNativeVoice(d);
    else if (kind === 'print') { waiting[d.id]?.(d); delete waiting[d.id]; }
    else if (kind === 'printer') showPrinter(d);
    else if (kind === 'saved') setStatus(d.message, !d.ok);
  };
  function showPrinter(d) {
    if (d.error) { setStatus(d.error, true); return; }
    $('printerName').textContent = $('printerName2').textContent = d.name || 'not picked yet';
  }

  // ---------- auto-print after voice: 2 seconds to change your mind ----------
  let cdTimer = null;
  function defaultBarClick() { cancelCountdown(); setStatus('Auto-print canceled. Tap Print when ready.'); }
  const autoPrintOn = () => store.get('autoPrint', true);
  async function armAutoPrint(seq, note = '') {
    const tok = state.token;
    await state.ready;                                       // let the art finish so the print matches the preview
    if (seq !== searchSeq || state.token !== tok) return;    // something else happened meanwhile
    startCountdown(`Printing ${tokenLabel()} ${note}`.trim(), () => { if (state.token === tok) printNow(); });
  }
  // Of these matches, the one printed most often (null if none has been printed)
  // The tally is per name + P/T; the exact version printed last (e.g. plain vs. Decayed) wins among those
  function favorite(list) {
    const counts = store.get('counts', {});
    let best = null, bestScore = 0;
    for (const t of list) {
      const e = counts[artKey(t)]; if (!e) continue;
      const score = e.n * 2 + (e.token?.text === t.text ? 1 : 0);
      if (score > bestScore) { best = t; bestScore = score; }
    }
    return best;
  }
  function startCountdown(text, go) {
    cancelCountdown();
    const bar = $('countdown');
    bar.querySelector('small').textContent = 'Tap to cancel';
    bar.style.setProperty('--dur', '2s');
    $('cdText').textContent = text;
    bar.hidden = false;
    bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');   // restart the drain animation
    cdTimer = setTimeout(() => { cdTimer = null; bar.hidden = true; go(); }, 2000);
  }
  function cancelCountdown() {
    if (cdTimer) { clearTimeout(cdTimer); cdTimer = null; }
    if (!$('countdown').hidden && $('countdown').onclick !== defaultBarClick) return;   // a tear pause owns the bar
    $('countdown').hidden = true;
  }

  async function doPrint() {
    cancelCountdown();
    if (NATIVE) return printNow();
    const blob = await toBlob(sheet());
    const file = new File([blob], fileName(), { type: 'image/png' });
    remember();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: state.token.name }); setStatus('Pick RawBT in the share sheet to print.'); }
      catch (e) { if (e.name !== 'AbortError') setStatus('Sharing failed. Use "Save image" and print it from RawBT.', true); }
    } else {
      setStatus("This browser can't share images. Use \"Save image\", or try the RawBT button.", true);
    }
  }
  async function doSave() {
    if (NATIVE) {                // the app's built-in browser can't download, so the app saves it to Pictures
      NATIVE.saveImage(sheet().toDataURL('image/png').split(',')[1], fileName());
      remember(); return;
    }
    const blob = await toBlob(sheet());
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    remember();
  }
  function doRawBT() {
    const data = sheet().toDataURL('image/png');
    remember();
    location.href = 'intent:' + data + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
  }

  // ---------- voice ----------
  // A spoken request starts fresh: no number said means one copy
  function voiceSearch(text) {
    if (!parse(text).qty) setQty(1);
    search(text, { voice: true });
  }

  // Inside the app: Android's speech recognizer
  let nativeListening = false;
  function onNativeVoice(d) {
    if (d.type === 'start') {
      nativeListening = true; $('mic').classList.add('listening');
      setStatus('Listening… say something like "three treasure".');
    } else if (d.type === 'partial') $('q').value = d.text || '';
    else if (d.type === 'final') { $('q').value = d.text || ''; if (d.text) voiceSearch(d.text); }
    else if (d.type === 'error') setStatus(
      d.code === 'not-allowed' ? 'Microphone permission is off. Allow it for Token Printer in Android settings.' :
      d.code === 'unavailable' ? "This phone has no speech recognizer. Install or update the Google app." :
      d.code === 'network' ? "Voice needs internet. Check your connection." :
      "Didn't catch that. Tap the mic and try again.", true);
    else if (d.type === 'end') { nativeListening = false; $('mic').classList.remove('listening'); }
  }

  // In Chrome: the browser's speech recognition
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if (!SR && !NATIVE) { $('mic').disabled = true; $('mic').title = 'Voice needs Chrome on Android over https'; }
  $('mic').onclick = () => {
    cancelCountdown();
    if (NATIVE) { if (nativeListening) NATIVE.stopVoice(); else NATIVE.startVoice(); return; }
    if (!SR) return;
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 1;
    $('mic').classList.add('listening'); setStatus('Listening… say something like "three one one soldiers".');
    rec.onresult = e => {
      const r = e.results[e.results.length - 1]; $('q').value = r[0].transcript;
      if (r.isFinal) voiceSearch(r[0].transcript);
    };
    rec.onerror = e => setStatus(e.error === 'not-allowed' ? 'Microphone permission was denied. Allow it in Chrome site settings.' : 'Didn\'t catch that. Tap the mic and try again.', true);
    rec.onend = () => { $('mic').classList.remove('listening'); rec = null; };
    rec.start();
  };

  // ---------- wiring ----------
  const QUICK = ['Treasure', 'Clue', 'Food', 'Blood', '1/1 white soldier', '2/2 black zombie', '1/1 green saproling', '1/1 white spirit flying'];
  const QUICK_SLOTS = 8;
  const chipLabel = t => (t.p != null ? `${t.p}/${t.t} ` : '') + t.name;
  // Most-printed tokens first (ties → most recent), then the defaults to fill the rest
  function renderQuick() {
    const learned = Object.values(store.get('counts', {}))
      .sort((a, b) => b.n - a.n || b.last - a.last).slice(0, QUICK_SLOTS).map(e => e.token);
    const box = $('quick'); box.innerHTML = '';
    learned.forEach(t => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip learned';
      b.textContent = chipLabel(t);
      b.onclick = () => { cancelCountdown(); $('q').value = chipLabel(t); setQty(1);
        searchSeq++; renderResults([]); setStatus('Ready to print.'); select(t); };
      box.appendChild(b);
    });
    const taken = t => learned.some(l => {                 // skip a default that's already a learned pick
      const p = parse(t);
      return l.name.toLowerCase() === p.words.join(' ') && (p.p == null || (String(l.p) === p.p && String(l.t) === p.t));
    });
    QUICK.filter(q => !taken(q)).slice(0, QUICK_SLOTS - learned.length).forEach(q => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = q;
      b.onclick = () => { $('q').value = q; setQty(1); search(q); }; box.appendChild(b);
    });
    $('resetPicks').hidden = !learned.length;
  }
  // First run with this feature: count what's already in "Recently printed" once each
  if (store.get('counts', null) === null) {
    const now = Date.now(), seed = {};
    store.get('recent', []).forEach((t, i) => { seed[artKey(t)] ??= { token: t, n: 1, last: now - i }; });
    store.set('counts', seed);
  }
  $('resetPicks').onclick = () => {
    if (!confirm('Forget which tokens you print most and go back to the default quick picks?')) return;
    store.set('counts', {}); renderQuick();
  };
  renderQuick();

  let deb;
  $('searchForm').onsubmit = e => { e.preventDefault(); clearTimeout(deb); setQty(1); search($('q').value); };
  $('q').oninput = () => { clearTimeout(deb); const v = $('q').value; if (v.trim().length >= 3) deb = setTimeout(() => search(v), 450); };
  $('styleArt').onclick = () => setStyle('art');
  $('styleText').onclick = () => setStyle('text');
  $('minus').onclick = () => { cancelCountdown(); setQty(state.qty - 1); };
  $('plus').onclick = () => { cancelCountdown(); setQty(state.qty + 1); };
  $('countdown').onclick = defaultBarClick;
  $('qty').onfocus = () => $('qty').select();
  $('qty').oninput = () => { const n = parseInt($('qty').value, 10); if (!isNaN(n)) state.qty = Math.max(1, Math.min(20, n)); };
  $('qty').onchange = () => setQty($('qty').value);   // tidy up blanks or out-of-range numbers when you leave the box
  $('qty').onkeydown = e => { if (e.key === 'Enter') $('qty').blur(); };
  $('print').onclick = doPrint;
  $('save').onclick = doSave;
  $('rawbt').onclick = doRawBT;
  $('moreArt').onclick = showArts;

  // Brightness / contrast — saved per phone, since they're really about this printer
  function showAdj() {
    $('bright').value = state.adj.bright; $('brightVal').textContent = state.adj.bright;
    $('contrast').value = state.adj.contrast; $('contrastVal').textContent = state.adj.contrast;
  }
  let adjFrame = 0;
  function onAdj() {
    state.adj = { bright: +$('bright').value, contrast: +$('contrast').value };
    $('brightVal').textContent = state.adj.bright; $('contrastVal').textContent = state.adj.contrast;
    store.set('adj', state.adj);
    cancelAnimationFrame(adjFrame); adjFrame = requestAnimationFrame(draw);
  }
  $('bright').oninput = onAdj;
  $('contrast').oninput = onAdj;
  $('adjReset').onclick = () => { state.adj = { bright: 0, contrast: 0 }; store.set('adj', state.adj); showAdj(); draw(); };
  state.adj = Object.assign({ bright: 0, contrast: 0 }, store.get('adj', {}));
  showAdj();
  $('cMake').onclick = () => {
    const name = $('cName').value.trim() || 'Token';
    const p = $('cP').value.trim(), t = $('cT').value.trim();
    select({ name, type: $('cType').value.trim() || 'Creature', text: $('cText').value.trim(),
      p: p || null, t: t || null, colors: [], thumb: '', art: '' });
  };

  // App-only controls
  if (NATIVE) {
    $('rawbt').hidden = true;
    $('autoWrap').hidden = false;
    $('autoPrint').checked = autoPrintOn();
    $('autoPrint').onchange = () => store.set('autoPrint', $('autoPrint').checked);
    $('printerRow').hidden = false;
    $('changePrinter').onclick = $('changePrinter2').onclick = () => NATIVE.choosePrinter();
    $('settingsBox').hidden = false;
    showSettings();
    for (const id of [...Object.keys(PFIELDS), 'setKeep']) $(id).onchange = readSettings;
    $('resetSettings').onclick = () => { pset = { ...PDEF }; showSettings(); readSettings(); setStatus('Printer settings reset.'); };
    $('testPrint').onclick = printTest;
    try { showPrinter(JSON.parse(NATIVE.info()).printer || {}); } catch {}
  }

  renderRecent();
  // Open in a working state
  $('q').value = '1/1 white soldier';
  search('1/1 white soldier');
})();
</script>
</body>
</html>
